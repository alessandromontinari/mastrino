<style>
/* Layout: a bank "mastrino" (account ledger). Header with scope switch, sticky section tabs, content in ruled panels; one column on phones */
:root {
  --bg: #F3F5F4;
  --surface: #FFFFFF;
  --surface-2: #EDF1EF;
  --ink: #0E1B17;
  --ink-2: #43524C;
  --muted: #6B7974;
  --line: #DCE3DF;
  --line-strong: #B8C4BE;
  --accent: #0F5E73;
  --accent-soft: rgba(15, 94, 115, .10);
  --up: #17774A;
  --down: #BF3328;
  --up-soft: #E0F1E7;
  --down-soft: #FBE5E2;
  --warn: #9A5B00;
  --warn-soft: #FBEFD9;
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4; --c6: #008300; --c7: #6250d6; --c8: #e34948;
  --on-accent: #FFFFFF;
  --f-ui: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1210; --surface: #131C19; --surface-2: #1A2521; --ink: #E3ECE8; --ink-2: #B4C2BC; --muted: #85948E; --line: #25322D; --line-strong: #394842;
    --accent: #62B8CD; --accent-soft: rgba(98, 184, 205, .14); --up: #3DC07F; --down: #FF7B6F; --up-soft: #12301F; --down-soft: #3A1916; --warn: #F2B33D; --warn-soft: #36290F;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767;
    --on-accent: #0B1210; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1210; --surface: #131C19; --surface-2: #1A2521; --ink: #E3ECE8; --ink-2: #B4C2BC; --muted: #85948E; --line: #25322D; --line-strong: #394842;
  --accent: #62B8CD; --accent-soft: rgba(98, 184, 205, .14); --up: #3DC07F; --down: #FF7B6F; --up-soft: #12301F; --down-soft: #3A1916; --warn: #F2B33D; --warn-soft: #36290F;
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767;
  --on-accent: #0B1210; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--f-mono); font-size: .86em; }
.up { color: var(--up); } .down { color: var(--down); } .muted { color: var(--muted); }
.app { max-width: 1180px; margin: 0 auto; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px 56px; }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 6px 0 10px; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { margin: 0; font-weight: 800; font-stretch: 118%; font-size: 1.65rem; letter-spacing: -.01em; line-height: 1; }
.brand h1 i { font-style: normal; color: var(--accent); }
.brand span { color: var(--muted); font-size: .8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-r { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; max-width: 100%; overflow-x: auto; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 7px; cursor: pointer; font-weight: 600; font-size: .86rem; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.pricebtn { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 11px; cursor: pointer; font-size: .8rem; color: var(--ink-2); }
.pricebtn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.pricebtn.ok .dot { background: var(--up); } .pricebtn.err .dot { background: var(--down); } .pricebtn.busy .dot { background: var(--warn); }
.privbtn svg { flex: none; }
.privbtn[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.hero-v.masked { color: var(--muted); letter-spacing: .08em; }
@media (max-width: 560px) { .privbtn span { display: none; } .privbtn { padding: 7px 9px; } }

/* nav */
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-bottom: 16px; }
.nav::-webkit-scrollbar { display: none; }
.nav button { border: 0; background: transparent; padding: 10px 12px 9px; cursor: pointer; font-weight: 600; font-size: .9rem; color: var(--muted); border-bottom: 2.5px solid transparent; white-space: nowrap; }
.nav button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

/* panels & grid */
.cols { display: grid; gap: 16px; }
@media (min-width: 980px) { .cols.two { grid-template-columns: minmax(0, 1.25fr) minmax(0, .75fr); align-items: start; } .cols.half { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; } }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; min-width: 0; }
.panel > h2, .ph { font-size: 1.05rem; font-weight: 750; font-stretch: 108%; margin: 0 0 10px; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.panel > h2 small, .ph small { font-weight: 500; font-stretch: 100%; font-size: .8rem; color: var(--muted); }
.panel h3 { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 16px 0 6px; font-weight: 700; }
.note { font-size: .82rem; color: var(--muted); margin: 6px 0 0; }
.note b { color: var(--ink-2); }

/* hero */
.hero { display: grid; gap: 14px; }
.hero-v { font-weight: 760; font-stretch: 112%; font-size: clamp(2.1rem, 8vw, 3.3rem); line-height: 1; letter-spacing: -.02em; }
.hero-sub { color: var(--ink-2); font-size: .92rem; display: flex; gap: 6px 16px; flex-wrap: wrap; }
.hero-sub b { font-variant-numeric: tabular-nums; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; background: var(--surface-2); min-width: 0; }
.chip span { display: block; font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
.chip b { font-size: 1.05rem; font-variant-numeric: tabular-nums; }

/* alerts */
.alerts { display: flex; flex-direction: column; gap: 8px; }
.alert { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
.alert .ic { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: .75rem; color: #fff; margin-top: 1px; }
.alert.crit { border-color: var(--down); background: var(--down-soft); } .alert.crit .ic { background: var(--down); }
.alert.warn { border-color: var(--warn); background: var(--warn-soft); } .alert.warn .ic { background: var(--warn); }
.alert.info .ic { background: var(--accent); }
.alert p { margin: 0; font-size: .88rem; }
.alert .t { font-weight: 700; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); display: block; }

/* tables */
.tw { overflow-x: auto; margin: 0 -2px; }
table.tbl { width: 100%; border-collapse: collapse; font-size: .86rem; }
.tbl th { text-align: right; font-size: .66rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; padding: 6px 8px; border-bottom: 1px solid var(--line-strong); white-space: nowrap; }
.tbl td { text-align: right; padding: 8px 8px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; white-space: nowrap; vertical-align: top; }
.tbl th:first-child, .tbl td:first-child { text-align: left; padding-left: 2px; }
.tbl td.l, .tbl th.l { text-align: left; }
.tbl td.wrap { white-space: normal; min-width: 180px; }
.tbl tr.click { cursor: pointer; }
.tbl tr.click:hover td { background: var(--surface-2); }
.tbl tr.sel td { background: var(--accent-soft); }
.tbl tfoot td { font-weight: 700; border-bottom: 0; }
.tbl .sub { display: block; color: var(--muted); font-size: .76rem; }
.pill { display: inline-block; font-size: .7rem; font-weight: 700; border-radius: 99px; padding: 2px 8px; border: 1px solid var(--line-strong); color: var(--ink-2); white-space: nowrap; }
.pill.ok { border-color: var(--up); color: var(--up); background: var(--up-soft); }
.pill.bad { border-color: var(--down); color: var(--down); background: var(--down-soft); }
.pill.warn { border-color: var(--warn); color: var(--warn); background: var(--warn-soft); }
.pill.acc { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 7px; vertical-align: 0; }

/* buttons & forms */
.btn { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 10px; padding: 8px 14px; cursor: pointer; font-weight: 600; font-size: .88rem; white-space: nowrap; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.danger { border-color: var(--down); color: var(--down); }
.btn.sm { padding: 5px 10px; font-size: .8rem; border-radius: 8px; }
.btn:disabled { opacity: .5; cursor: default; }
.link { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: inherit; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.toolbar .grow { flex: 1; min-width: 160px; }
.fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px 12px; }
.field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field label { font-size: .74rem; font-weight: 700; color: var(--ink-2); }
.field label small { font-weight: 500; color: var(--muted); }
.inp { width: 100%; border: 1.5px solid var(--line-strong); background: var(--surface); border-radius: 9px; padding: 8px 10px; min-height: 40px; font-variant-numeric: tabular-nums; }
.inp:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea.inp { min-height: 110px; font-family: var(--f-mono); font-size: .78rem; }
.check { display: flex; gap: 9px; align-items: flex-start; font-size: .88rem; cursor: pointer; }
.check input { width: 17px; height: 17px; accent-color: var(--accent); margin: 2px 0 0; flex: none; }
.formbox { background: var(--surface-2); border-radius: 10px; padding: 12px; margin-top: 10px; }
.formbox h4 { margin: 0 0 8px; font-size: .8rem; }
.sumrow { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; font-size: .88rem; border-bottom: 1px dashed var(--line); }
.sumrow:last-child { border-bottom: 0; font-weight: 700; }
.err { color: var(--down); font-size: .84rem; }
.okmsg { color: var(--up); font-size: .84rem; }

/* sheet (overlay) */
.sheet-bg { position: fixed; inset: 0; z-index: 50; background: rgba(5, 12, 10, .45); display: flex; justify-content: center; align-items: flex-start; padding: calc(env(safe-area-inset-top, 0px) + 24px) 12px 24px; overflow-y: auto; }
.sheet { background: var(--surface); border-radius: 16px; width: 100%; max-width: 760px; padding: 18px; box-shadow: 0 20px 60px rgba(0, 0, 0, .25); }
.sheet-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
.sheet-h h2 { margin: 0; font-size: 1.15rem; font-weight: 760; font-stretch: 110%; }
.sheet-f { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); }
.x { border: 0; background: var(--surface-2); width: 34px; height: 34px; border-radius: 50%; cursor: pointer; font-size: 1.1rem; line-height: 1; }

/* charts */
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .tt { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 8px; padding: 7px 9px; font-size: .78rem; box-shadow: 0 6px 18px rgba(0, 0, 0, .12); min-width: 150px; z-index: 2; }
.chart .tt b { font-variant-numeric: tabular-nums; }
.chart .tt div { display: flex; justify-content: space-between; gap: 12px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .78rem; color: var(--ink-2); margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; }
.legend i.dash { background: repeating-linear-gradient(90deg, var(--muted) 0 4px, transparent 4px 7px); }
.donut-wrap { display: grid; gap: 12px; align-items: center; }
.donut-wrap svg { width: 100%; max-width: 200px; height: auto; margin: 0 auto; display: block; }
.bars { max-width: 640px; }

/* guide */
.guide details { border-bottom: 1px solid var(--line); }
.guide summary { cursor: pointer; padding: 12px 2px; font-weight: 700; list-style: none; display: flex; justify-content: space-between; gap: 10px; }
.guide summary::-webkit-details-marker { display: none; }
.guide summary::after { content: "+"; color: var(--muted); font-weight: 500; }
.guide details[open] summary::after { content: "–"; }
.guide .body { padding: 0 2px 16px; font-size: .92rem; max-width: 70ch; }
.guide .body p { margin: 0 0 10px; }
.guide .f { font-family: var(--f-mono); font-size: .82rem; background: var(--surface-2); border-radius: 8px; padding: 9px 11px; margin: 6px 0 12px; overflow-x: auto; white-space: pre-wrap; }
.qmark { display: inline-grid; place-items: center; width: 17px; height: 17px; border-radius: 50%; border: 1px solid var(--line-strong); font-size: .66rem; font-weight: 800; color: var(--muted); cursor: pointer; background: var(--surface); vertical-align: 1px; margin-left: 4px; padding: 0; }
.qmark:hover { border-color: var(--accent); color: var(--accent); }

.empty { text-align: center; padding: 34px 16px; }
.empty h2 { font-weight: 780; font-stretch: 112%; font-size: 1.5rem; margin: 0 0 8px; }
.empty p { color: var(--ink-2); max-width: 52ch; margin: 0 auto 16px; }
.empty .btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.demo { background: var(--warn-soft); border: 1px solid var(--warn); border-radius: 10px; padding: 9px 12px; font-size: .86rem; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 10px; font-size: .88rem; z-index: 60; max-width: calc(100% - 32px); box-shadow: 0 8px 24px rgba(0, 0, 0, .2); }
.bk-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.bk-msg { font-size: .84rem; margin-top: 8px; display: flex; flex-direction: column; align-items: flex-start; }
.bk-msg:empty { display: none; }
.bk-imp { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; align-items: flex-start; }
.bk-imp textarea { width: 100%; min-height: 70px; border: 1.5px solid var(--line-strong); border-radius: 9px; background: var(--surface-2); color: var(--ink); font-family: var(--f-mono); font-size: .75rem; padding: 8px; }
@media (max-width: 480px) {
  .brand span { display: none; }
  .panel { padding: 14px 12px; }
  .sheet { padding: 14px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<div class="app">
  <header class="top">
    <div class="brand"><h1>Mastr<i>ino</i></h1><span>Il patrimonio di famiglia, movimento per movimento</span></div>
    <div class="top-r">
      <div class="seg" id="scope" role="group" aria-label="Portafoglio"></div>
      <button type="button" class="pricebtn privbtn" id="privBtn" aria-pressed="false" title="Nascondi gli importi"><svg class="eye-on" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><svg class="eye-off" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="display:none"><path d="M3.5 8.5C5.3 6.8 8.2 5.5 12 5.5c6.4 0 10 6.5 10 6.5a17 17 0 0 1-3 3.6M14.5 18.1c-.8.2-1.6.4-2.5.4-6.4 0-10-6.5-10-6.5a16.6 16.6 0 0 1 2.4-3.1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M4 4l16 16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span id="privTxt">Nascondi importi</span></button>
      <button type="button" class="pricebtn" id="priceBtn"><i class="dot"></i><span id="priceTxt">Prezzi</span></button>

<script>
(function () {
'use strict';
/* ================= helpers ================= */
var DAYMS = 86400000;
function pad2(n) { return (n < 10 ? '0' : '') + n; }
function dayOf(s) { var p = String(s).split('-'); return Math.round(Date.UTC(+p[0], +p[1] - 1, +p[2]) / DAYMS); }
function isoOf(d) { var t = new Date(d * DAYMS); return t.getUTCFullYear() + '-' + pad2(t.getUTCMonth() + 1) + '-' + pad2(t.getUTCDate()); }
function yearOf(d) { return new Date(d * DAYMS).getUTCFullYear(); }
function fmtDay(d) { var t = new Date(d * DAYMS); return pad2(t.getUTCDate()) + '/' + pad2(t.getUTCMonth() + 1) + '/' + t.getUTCFullYear(); }
function eoy(y) { return Math.round(Date.UTC(y, 11, 31) / DAYMS); }

function bondExample() {
  var m = STATE.movements.filter(function (x) {
    var ins = STATE.instruments[x.isin]; if (x.type !== 'ACQUISTO' || !isBond(ins) || !ins.coupon || !ins.maturity) return false;
    var pp = couponPeriod(ins, dayOf(x.vdate || x.date)); return pp && cpnFactor(ins, pp.prev, pp.next) === 1;
  })[0];
  if (!m) return null;
  var ins = STATE.instruments[m.isin], vd = dayOf(m.vdate || m.date), p = couponPeriod(ins, vd);
  if (!p) return null;
  var days = vd - p.start, per = p.next - p.prev, rateo = m.qty / 100 * ins.coupon / ins.freq * days / per;
  return { m: m, ins: ins, vd: vd, p: p, days: days, per: per, rateo: rateo, rr: rateo * incomeRate(ins) };
}

  { g: 'Obbligazioni', id: 'duration', t: 'Duration', b: function () {

  { g: 'Fisco', id: 'pmc', t: 'Prezzo medio di carico', b: function () {

  { g: 'Fisco', id: 'categorie', t: 'Perché ETF, ETC e titoli di Stato sono tassati diversamente', b: function () {

  { g: 'Fisco', id: 'zainetto', t: 'Zainetto fiscale e scadenza delle minusvalenze', b: function () {

  { g: 'Fisco', id: 'bollo', t: 'Imposta di bollo', b: function () {

  { g: 'Portafoglio', id: 'mtm', t: 'Valore di mercato e guadagno', b: function () {

  { g: 'Portafoglio', id: 'depositi', t: 'Depositi vincolati', b: function () {

  { g: 'Portafoglio', id: 'ribilancia', t: 'Obiettivi e ribilanciamento', b: function () {

  { g: 'Rendimenti e rischio', id: 'twr', t: 'Rendimento TWR (time-weighted)', b: function () {

  { g: 'Rendimenti e rischio', id: 'irr', t: 'Rendimento sui versamenti (IRR o money-weighted)', b: function () {

/* ================= backup: move data to another phone ================= */
function setupBackup(cfg) {
  var box = cfg.el, text = '', parsed = null;

  function fileName() { var d = new Date(); return cfg.app + '-backup-' + d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + '.txt'; }
  box.innerHTML = '<p class="note" style="margin-top:0">' + cfg.intro + '</p>' +
    '<div class="bk-row"><button type="button" class="btn sm primary" data-bk="export">Esporta backup</button><button type="button" class="btn sm" data-bk="import">Importa backup</button></div>' +
    '<div class="bk-msg" role="status"></div>' +
    '<div class="bk-imp" hidden><button type="button" class="btn sm" data-bk="file">Scegli il file</button><label class="note" for="' + cfg.app + '-bk-text">oppure incolla qui il testo esportato</label><textarea id="' + cfg.app + '-bk-text" rows="3" spellcheck="false"></textarea><button type="button" class="btn sm primary" data-bk="paste">Importa il testo</button></div>' +
    '<input type="file" accept=".txt,.json,text/plain,application/json" hidden>';
  var msg = box.querySelector('.bk-msg'), imp = box.querySelector('.bk-imp'), area = box.querySelector('textarea'), file = box.querySelector('input[type=file]');
  function say(html) { msg.innerHTML = html; }
  function copyLink() { return ' <button type="button" class="link" data-bk="copy">Copia il testo</button>'; }
  function download(name) {
    try {
      var url = URL.createObjectURL(new Blob([text], { type: 'text/plain' }));
      var a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
      say('Ho scaricato <b>' + name + '</b> nella cartella Download. Mandalo al telefono nuovo, oppure:' + copyLink());
    } catch (e) { say('Non riesco a creare il file qui.' + copyLink()); }
  }
  function doExport() {
    text = JSON.stringify(cfg.build());
    var name = fileName();
    if (IN_CLAUDE) {
      say('Preparo il file…');
      window.claude.use('downloads').then(function (dl) {
        if (!dl) { say('Da qui non posso salvare file:' + copyLink()); return; }
        return dl.save({ filename: name, data: text }).then(function () { say('File <b>' + name + '</b> pronto. In alternativa:' + copyLink()); }, function (e) { say((e && e.code === 'declined' ? 'Salvataggio annullato.' : 'Il file non è stato salvato.') + copyLink()); });
      });
      return;
    }
    try {
      var f = new File([text], name, { type: 'text/plain' });
      if (navigator.canShare && navigator.canShare({ files: [f] })) {
        navigator.share({ files: [f], title: 'Backup ' + cfg.title }).then(function () { say('File <b>' + name + '</b> condiviso. Aprilo con “Importa backup” sul telefono nuovo.' + copyLink()); }, function (e) { if (e && e.name === 'AbortError') say('Condivisione annullata.' + copyLink()); else download(name); });
        return;
      }
    } catch (e) {}
    download(name);
  }
  function doCopy() {
    function fallback() { imp.hidden = false; area.value = text; area.focus(); area.select(); say('Il testo è selezionato qui sotto: copialo e mandatelo.'); }
    try { navigator.clipboard.writeText(text).then(function () { say('Testo copiato. Incollalo in un messaggio a te stesso, poi sul telefono nuovo in “Importa backup”.'); }, fallback); } catch (e) { fallback(); }
  }
  function handle(raw) {
    var obj = null;
    try { obj = JSON.parse(String(raw || '').trim()); } catch (e) {}
    if (!obj || typeof obj !== 'object') { say('Non riconosco questo testo: deve essere il file creato con “Esporta backup”.'); return; }
    if (obj.app !== cfg.app) { say('Questo file è di un’altra app' + (obj.app ? ' (' + String(obj.app).replace(/[<>&]/g, '') + ')' : '') + '.'); return; }
    parsed = obj;
    say('<span>File del ' + stamp(obj.at || Date.now()) + ': ' + cfg.describe(obj) + '. ' + cfg.confirm + '</span><span class="bk-row" style="margin-top:8px"><button type="button" class="btn sm primary" data-bk="yes">' + cfg.yes + '</button><button type="button" class="btn sm" data-bk="no">Annulla</button></span>');
  }
  box.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-bk]'); if (!b) return;
    var k = b.getAttribute('data-bk');
    if (k === 'export') doExport();
    else if (k === 'copy') doCopy();
    else if (k === 'import') { imp.hidden = !imp.hidden; say(''); }
    else if (k === 'file') file.click();
    else if (k === 'paste') { if (area.value.trim()) handle(area.value); else say('Incolla prima il testo esportato.'); }
    else if (k === 'yes' && parsed) { try { cfg.apply(parsed); toast('Dati importati.'); } catch (e) { say('Qualcosa è andato storto durante l’importazione.'); } parsed = null; }
    else if (k === 'no') { parsed = null; say(''); }
  });
  file.addEventListener('change', function () {
    var f = file.files && file.files[0]; if (!f) return;
    var r = new FileReader(); r.onload = function () { handle(r.result); file.value = ''; }; r.onerror = function () { say('Non riesco a leggere il file.'); }; r.readAsText(f);
  });
}

  var isins = Object.keys(held);
  if (!isins.length) { if (manual) toast('Non ci sono titoli da aggiornare.'); return; }
  STATE.meta.priceStatus = { busy: true }; renderHeader();
  var url = proxy.replace(/\/+$/, '') + '/?isin=' + isins.join(',') + '&t=' + isins.map(function (k) { return held[k].kind; }).join(',') + '&u=' + isins.map(function (k) { return encodeURIComponent(held[k].path || ''); }).join(',');
  fetch(url, { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }).then(function (j) {

}

      bt.map(function (x) { return '<tr><td class="l wrap">' + esc(x.p.ins.name) + '</td>' + (PRIV() ? '' : '<td>' + qf(x.p.qty) + '</td>') + '<td>' + nf(x.p.price, 3) + '</td><td>' + (x.p.ins.maturity ? fmtDay(dayOf(x.p.ins.maturity)) : '–') + '</td><td>' + (x.a ? pct(x.a.y, 2) : '–') + '</td><td>' + (x.b ? pct(x.b.y, 2) : '–') + '</td><td>' + (x.a ? nf(x.a.mod, 2) : '–') + '</td></tr>'; }).join('') +
      '</tbody>' + (tv ? '<tfoot><tr><td>Media ponderata</td>' + (PRIV() ? '' : '<td></td>') + '<td></td><td></td><td>' + pct(wy / tv, 2) + '</td><td>' + pct(wyn / tv, 2) + '</td><td>' + nf(wd / tv, 2) + '</td></tr></tfoot>' : '') + '</table></div><p class="note">Rendimenti calcolati sul prezzo di oggi, come se tenessi il titolo fino alla scadenza.</p></section>';
  }
  /* calendar */
  var fl = futureFlows(RES, r.id, 730);
  h += '<section class="panel"><h2>Calendario degli incassi <small>prossimi 24 mesi</small></h2>';
  if (!fl.length) h += '<p class="note" style="margin:0">Nessun flusso previsto.</p>';
  else {
    var byM = {}; fl.forEach(function (f) { var d = new Date(f.day * DAYMS), k = d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1); (byM[k] = byM[k] || []).push(f); });
    h += '<div class="tw"><table class="tbl"><thead><tr><th>Data</th><th class="l">Cosa</th><th>Lordo</th><th>Netto</th></tr></thead><tbody>' + Object.keys(byM).sort().map(function (k) {
      var list = byM[k], tot = sum(list.map(function (f) { return f.net; })), p = k.split('-');
      return '<tr><td colspan="3" style="text-align:left;font-weight:700;background:var(--surface-2)">' + MONTHS[+p[1] - 1] + ' ' + p[0] + '</td><td style="font-weight:700;background:var(--surface-2)">' + eur(tot) + '</td></tr>' + list.map(function (f) { return '<tr><td>' + fmtDay(f.day) + '</td><td class="l wrap">' + esc(f.desc) + '<span class="sub">' + f.kind + (f.pf && STATE.portfolios.length > 1 && r.id === '*' ? ' · ' + esc(pfName(f.pf)) : '') + '</span></td><td>' + eur(f.gross) + '</td><td>' + eur(f.net) + '</td></tr>'; }).join('');
    }).join('') + '</tbody></table></div>';
  }
  h += '</section></div>';
  host.innerHTML = h;
  if ($('anPrices')) $('anPrices').addEventListener('click', openPriceImport);
}

/* ================= settings ================= */
function renderSettings(host) {
  var s = STATE.settings;
  var h = '<div class="cols half"><div class="stack"><section class="panel"><h2>Modalità riservata</h2><label class="check" for="sPriv"><input type="checkbox" id="sPriv"' + (PRIV() ? ' checked' : '') + '> Nascondi il totale e tutti gli importi in euro: restano solo le percentuali</label><p class="note">Utile per mostrare l’app a qualcuno. Si attiva anche dall’icona con l’occhio in alto. Vale solo su questo dispositivo e non cambia i dati.</p></section>' +
    '<section class="panel"><h2>Portafogli</h2><div id="pfList">' + STATE.portfolios.map(function (p) {
    var used = STATE.movements.some(function (m) { return m.pf === p.id; });
    return '<div class="toolbar" style="margin-bottom:8px"><input class="inp grow" data-pfname="' + p.id + '" value="' + esc(p.name) + '" aria-label="Nome portafoglio"><button type="button" class="btn sm" data-pfdel="' + p.id + '"' + (used ? ' disabled title="Ha dei movimenti"' : '') + '>Elimina</button></div>';
  }).join('') + '</div><div class="toolbar"><button type="button" class="btn sm" id="pfAdd">+ Aggiungi portafoglio</button><button type="button" class="btn sm primary" id="pfSave">Salva i nomi</button></div><p class="note">Ogni portafoglio ha il suo zainetto fiscale: le minusvalenze di uno non compensano i guadagni dell’altro.</p></section>';
  h += '<section class="panel"><h2>Calcoli</h2><div class="fgrid"><div class="field"><label for="sShort">Bond brevi se scadono entro <small>anni</small></label><input class="inp" id="sShort" inputmode="decimal" value="' + nf(s.shortYears, 1).replace(/,0$/, '') + '"></div>' +
    '<div class="field"><label for="sRf">Tasso privo di rischio <small>% annuo, per lo Sharpe</small></label><input class="inp" id="sRf" inputmode="decimal" value="' + nf(s.rf, 2) + '"></div>' +
    '<div class="field"><label for="sBand">Banda di ribilanciamento <small>punti %</small></label><input class="inp" id="sBand" inputmode="decimal" value="' + nf(s.band, 1).replace(/,0$/, '') + '"></div></div><div class="toolbar" style="margin:12px 0 0"><button type="button" class="btn sm primary" id="sCalc">Salva</button></div></section>';
  h += '<section class="panel"><h2>Prezzi automatici' + q('ponte') + '</h2><div class="field"><label for="sProxy">Indirizzo del ponte Cloudflare</label><input class="inp mono" id="sProxy" placeholder="https://mastrino-prezzi.tuonome.workers.dev" value="' + esc(s.proxy || '') + '"></div>' +
    '<label class="check" for="sAuto" style="margin-top:10px"><input type="checkbox" id="sAuto"' + (s.autoPrices ? ' checked' : '') + '> Aggiorna i prezzi quando apro l’app (al massimo ogni 30 minuti)</label>' +
    '<div class="toolbar" style="margin:12px 0 0"><button type="button" class="btn sm primary" id="sProxySave">Salva</button><button type="button" class="btn sm" id="sProxyTest">Prova il ponte</button></div><div id="sProxyOut" class="note"></div>' +
    (IN_CLAUDE ? '<p class="note"><b>In questa anteprima dentro Claude</b> la pagina non può collegarsi a siti esterni: i prezzi automatici funzionano solo nell’app installata sul telefono.</p>' : '') + '</section></div>';
  h += '<div class="stack"><section class="panel"><h2>Dati</h2><div class="toolbar"><button type="button" class="btn sm" id="dCsv">Esporta movimenti (CSV)</button><button type="button" class="btn sm" id="dImp">Importa CSV</button><button type="button" class="btn sm" id="dPx">Importa prezzi storici</button></div>' +
    '<p class="note">' + STATE.movements.length + ' movimenti, ' + Object.keys(STATE.instruments).length + ' titoli. ' + (storageOK ? 'Salvati su questo dispositivo.' : '<span class="err">Il salvataggio su questo dispositivo non funziona: esporta un backup.</span>') + '</p></section>';
  h += '<section class="panel"><h2>Backup e cambio telefono</h2><div id="backupBox"></div></section>';
  h += '<section class="panel"><h2>Ricomincia</h2><div class="toolbar"><button type="button" class="btn sm" id="dDemo">Carica i dati di esempio</button><button type="button" class="btn sm danger" id="dWipe">Cancella tutti i dati</button></div><p class="note" id="dWipeMsg"></p></section></div></div>';
  host.innerHTML = h;
  Array.prototype.forEach.call(host.querySelectorAll('[data-pfdel]'), function (b) { b.addEventListener('click', function () { var id = b.getAttribute('data-pfdel'); STATE.portfolios = STATE.portfolios.filter(function (p) { return p.id !== id; }); if (UI.scope === id) UI.scope = '*'; changed(); }); });
  $('sPriv').addEventListener('change', function () { setPriv(this.checked); });
  $('pfAdd').addEventListener('click', function () { STATE.portfolios.push({ id: newId('p'), name: 'Nuovo portafoglio' }); changed(); });
  $('pfSave').addEventListener('click', function () { Array.prototype.forEach.call(host.querySelectorAll('[data-pfname]'), function (inp) { var p = STATE.portfolios.filter(function (x) { return x.id === inp.getAttribute('data-pfname'); })[0]; if (p && inp.value.trim()) p.name = inp.value.trim(); }); changed(); toast('Nomi salvati.'); });
  $('sCalc').addEventListener('click', function () { var a = parseIt($('sShort').value), b = parseIt($('sRf').value), c = parseIt($('sBand').value); if (a > 0) s.shortYears = a; if (b !== null && !isNaN(b)) s.rf = b; if (c > 0) s.band = c; changed(); toast('Impostazioni salvate.'); });
  $('sProxySave').addEventListener('click', function () { s.proxy = $('sProxy').value.trim(); s.autoPrices = $('sAuto').checked; save(); toast('Salvato.'); });
  $('sProxyTest').addEventListener('click', function () {
    var u = $('sProxy').value.trim().replace(/\/+$/, ''); if (!u) { $('sProxyOut').textContent = 'Scrivi prima l’indirizzo.'; return; }
    $('sProxyOut').textContent = 'Provo…';
    fetch(u + '/?isin=IT0005433690,IE00B4L5Y983&t=stato,etf', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) {
      var qs = j.quotes || {}; $('sProxyOut').innerHTML = Object.keys(qs).map(function (k) { var x = qs[k]; return '<span class="mono">' + k + '</span>: ' + (x.ok ? '<span class="okmsg">' + nf(x.price, 3) + ' del ' + (x.date ? fmtDateIT(x.date) : '?') + '</span>' : '<span class="err">non trovato</span>'); }).join('<br>') || esc(JSON.stringify(j).slice(0, 200));
    }).catch(function (e) { $('sProxyOut').innerHTML = '<span class="err">Non riesco a raggiungerlo (' + esc(e.message || e) + ').' + (IN_CLAUDE ? ' In questa anteprima è normale: provalo dall’app sul telefono.' : ' Controlla l’indirizzo.') + '</span>'; });
  });
  $('dCsv').addEventListener('click', function () { offerFile('mastrino-movimenti-' + isoOf(todayDay()) + '.csv', '﻿' + exportCSV(STATE), 'text/csv'); });

  $('dPx').addEventListener('click', openPriceImport);
  $('dDemo').addEventListener('click', function () { if (STATE.movements.length && !STATE.meta.demo) { $('dWipeMsg').innerHTML = 'Hai già dei dati: per caricare l’esempio prima cancellali (o esporta un backup).'; return; } loadDemo(); });
  $('dWipe').addEventListener('click', function () {

    this.setAttribute('data-c', '1'); this.textContent = 'Conferma: cancella tutto'; $('dWipeMsg').textContent = 'Non si può annullare. Se vuoi, prima esporta un backup.';

    intro: 'Esporta qui un file con tutti i dati (movimenti, titoli, prezzi, obiettivi), mandatelo e importalo nell’app sul telefono nuovo.',
    build: function () { return Object.assign({ app: 'mastrino', at: Date.now() }, STATE); },
    describe: function (o) { return (o.movements || []).length + ' movimenti e ' + Object.keys(o.instruments || {}).length + ' titoli'; },
    confirm: 'Sostituisco i dati di questo telefono con quelli del file?', yes: 'Sostituisci',
    apply: function (o) { var b = blankState(); STATE = Object.assign(b, { portfolios: o.portfolios || [], instruments: o.instruments || {}, movements: o.movements || [], settings: Object.assign(b.settings, o.settings || {}), targets: o.targets || {}, meta: Object.assign(b.meta, o.meta || {}) }); changed(); }
  });
}

/* ================= demo ================= */
function loadDemo() {
  STATE = blankState();
  var imp = parseImport(EXAMPLE_CSV);
  applyImport(imp, true);
  var today = todayDay(), prices = { IE00B4L5Y983: 131.2, IE00B579F325: 330.5, IT0005433690: 95.98, IE00B3RBWM25: 141.0 };
  var seed = 7; function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
  Object.keys(prices).forEach(function (isin) {
    var ins = STATE.instruments[isin]; if (!ins) return;
    var pts = STATE.movements.filter(function (m) { return m.isin === isin && m.price > 0; }).map(function (m) { return [dayOf(m.date), m.price]; });
    pts.push([today, prices[isin]]); pts.sort(function (a, b) { return a[0] - b[0]; });
    var start = Math.min(pts[0][0], dayOf('2025-01-10')), vol = isBond(ins) ? 0.0012 : isin === 'IE00B579F325' ? 0.011 : 0.009, hist = [], walk = 0;
    if (pts[0][0] > start) pts.unshift([start, pts[0][1] * (isBond(ins) ? 0.995 : 0.97)]);
    for (var k = 0; k < pts.length - 1; k++) {
      var a = pts[k], b = pts[k + 1], len = b[0] - a[0], noise = [], acc = 0;
      for (var d = 0; d <= len; d++) { acc += (rnd() - 0.5) * 2 * vol; noise.push(acc); }
      for (d = 0; d <= len; d++) {
        var day = a[0] + d, wd = new Date(day * DAYMS).getUTCDay(); if (wd === 0 || wd === 6) continue;
        var base = a[1] + (b[1] - a[1]) * d / len, bridge = noise[d] - noise[len] * d / len;
        hist.push([isoOf(day), Math.round(base * Math.exp(bridge) * 1000) / 1000]);
      }
    }
    ins.hist = hist; ins.price = { v: prices[isin], d: isoOf(today), src: 'esempio' };
  });
  STATE.targets['*'] = { equity: 45, bond_breve: 20, bond_lungo: 10, metalli: 10, depositi: 10, cash: 5 };
  STATE.meta.demo = true;
  changed();
  toast('Dati di esempio caricati.');
}

/* ================= boot ================= */
load();
recompute();
if (!STATE.movements.length && IN_CLAUDE) { try { loadDemo(); } catch (e) {} }
render();
var rzT = null; window.addEventListener('resize', function () { clearTimeout(rzT); rzT = setTimeout(function () { if (UI.tab === 'panoramica') render(); }, 200); });
if (STATE.settings.autoPrices && STATE.settings.proxy && !IN_CLAUDE && (!STATE.meta.lastPrices || Date.now() - STATE.meta.lastPrices > 30 * 60000)) setTimeout(function () { updatePrices(false); }, 400);

})();
</script>
